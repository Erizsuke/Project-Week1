spring:
  application:
    name: task-manager
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: ${MAX_MULTIPART_FILE_SIZE:300MB}
      max-request-size: ${MAX_MULTIPART_REQUEST_SIZE:300MB}

app:
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  upload:
    max-document-size: ${MAX_DOCUMENT_UPLOAD_SIZE:20MB}
    max-image-size: ${MAX_IMAGE_UPLOAD_SIZE:10MB}
    max-video-size: ${MAX_VIDEO_UPLOAD_SIZE:300MB}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:System Administrator}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.yourorg.taskmanager.auth: DEBUG
    com.yourorg.taskmanager.project: DEBUG
    com.yourorg.taskmanager.assignment: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
